version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 9
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    ignore:
      # Floating major tag (@v4) is the documented way to pin codeql-action.
      # Only majors are worth a PR; minor/patch pins would churn weekly.
      - dependency-name: github/codeql-action
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
